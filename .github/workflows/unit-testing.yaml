name: Unit testing

on:
  push:
    branches:
      - main
      - develop
      - 'review/**'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'bin/linux/**'
      - 'lib/**'
      - 'uac'
      - 'dfir.py'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/unit-testing.yaml'
      - 'artifacts/**'
      - 'profiles/**'
      - 'config/**'
      
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Unit testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout uac repository
        uses: actions/checkout@v4
        with:
          path: uac

      - name: Install native test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y busybox zip

      - name: Run fork regression tests with multiple shells
        working-directory: uac
        run: |
          python3 -m unittest discover -s tests -p test_dfir.py -v
          for test_shell in '/bin/dash' '/bin/bash' 'busybox sh'; do
            UAC_TEST_SHELL="$test_shell" python3 -m unittest discover -s tests -p test_shell_fixes.py -v
          done

      - name: Checkout ushunit repository
        uses: actions/checkout@v4
        with:
          repository: tclahr/ushunit
          ref: fa450589927338ec8c229307b101279bb474e759
          path: ushunit

      - name: Checkout uac-tests repository
        uses: actions/checkout@v4
        with:
          repository: tclahr/uac-tests
          ref: 674e7498f4a04e127d41b3ebf33ff8f2e9790e48
          path: uac-tests
      
      - name: Run tests
        working-directory: ushunit
        run: |
          python3 ../uac/tools/prepare_compat_tests.py ../uac-tests
          # These helper contracts changed intentionally and have fork fixtures.
          # The upstream main-script suite also collects live /etc; fork integration
          # tests use synthetic mounted trees instead.
          set --
          for test_file in ../uac-tests/tests/lib/*.sh; do
            case "$test_file" in
              */test_init_temp_data_dir.sh|*/test_log_msg.sh|*/test_verbose_msg.sh|*/test_tar_gz_data.sh|*/test_create_acquisition_log.sh) continue ;;
            esac
            set -- "$@" "$test_file"
          done
          UAC_DIR="../uac" ./ushunit -i "$@"
